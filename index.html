<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymLog</title>
<meta name="description" content="Personal workout tracker with splits, set logging, rest timer and progress charts.">
<meta name="theme-color" content="#0A0A0B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>:root{
  color-scheme: dark;
  --bg:#0A0A0B; --s1:#141416; --s2:#1B1B1E; --s3:#25252A; --line:#26262B; --line2:#34343A;
  --tx:#F5F5F6; --tx2:#A3A3AB; --tx3:#6E6E76;
  --acc:#C9F558; --acc-dim:rgba(201,245,88,.12); --acc-line:rgba(201,245,88,.38); --acc-ink:#0B0F02;
  --warn:#FF9F43; --warn-dim:rgba(255,159,67,.14);
  --danger:#FF5C5C;
  --r-lg:20px; --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --tab-h:58px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{min-height:100dvh;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.4;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
main{padding:calc(var(--sat) + 14px) 16px calc(var(--tab-h) + var(--sab) + 96px);max-width:560px;margin:0 auto}
h1{font-size:30px;letter-spacing:-.02em;margin:2px 0 0;font-weight:750;line-height:1.1}
h2{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:700}
h3{font-size:17px;margin:0;font-weight:650}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:650}
.muted{color:var(--tx2)} .faint{color:var(--tx3)} .small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.acc{color:var(--acc)}

/* layout */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.page-head .back{display:inline-flex;align-items:center;gap:2px;color:var(--tx2);font-weight:600;font-size:15px;margin-bottom:6px;margin-left:-6px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}
.section-title a,.section-title button{color:var(--tx2);font-size:14px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-weight:650;font-size:16px;transition:transform .08s,background .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.lg{min-height:56px;font-size:17px;border-radius:16px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.ghost{background:transparent}
.btn.danger-ghost{background:transparent;border-color:transparent;color:var(--danger)}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg.i{width:20px;height:20px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;background:var(--s2);border:1px solid var(--line);flex:none;color:var(--tx)}
.icon-btn.sm{width:38px;height:38px;border-radius:10px;background:transparent;border-color:transparent;color:var(--tx2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled{opacity:.25;pointer-events:none}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:transparent}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 8px calc(var(--sab) + 4px);background:rgba(10,10,11,.86);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line)}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;font-size:11px;font-weight:600;color:var(--tx3)}
.tab.on{color:var(--tx)} .tab.on svg{color:var(--acc)}

/* mini timer */
.mini{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + var(--sab) + 12px);z-index:19;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--s2);border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.55)}
.mini[hidden]{display:none}
.mini .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.mini.over .t{color:var(--warn)}
.mini .lbl{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toast */
.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-16px);opacity:0;z-index:70;background:var(--s3);border:1px solid var(--line2);padding:12px 16px;border-radius:14px;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.25s;max-width:calc(100vw - 32px);pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--danger);color:#ffd6d6}

/* banner */
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-lg);background:var(--acc-dim);border:1px solid var(--acc-line);margin-bottom:14px}
.banner.warn{background:var(--warn-dim);border-color:rgba(255,159,67,.4)}
.banner .grow p{font-size:13px;color:var(--tx2);margin-top:2px}

/* home */
.today{padding:18px;background:linear-gradient(160deg,#1d2210 0%,var(--s1) 55%);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 14px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.today h2{font-size:26px;letter-spacing:-.02em}
.today .preview{color:var(--tx2);font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.stat .v{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.stat .v small{font-size:15px;color:var(--tx3);font-weight:600}
.weekdots{display:flex;gap:5px;margin-top:10px}
.weekdots span{flex:1;height:6px;border-radius:6px;background:var(--s3)}
.weekdots span.on{background:var(--acc)}
.weekdots span.is-today{outline:1px solid var(--tx3);outline-offset:1px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:16px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--tx2)}
.quick a svg{color:var(--tx)}

/* list rows */
.list-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px}
.list-row .meta{font-size:13px;color:var(--tx2);margin-top:2px}
.date-badge{width:48px;flex:none;text-align:center;border-radius:12px;background:var(--s2);padding:6px 0}
.date-badge b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.date-badge span{font-size:11px;color:var(--tx3);text-transform:uppercase;font-weight:700;letter-spacing:.04em}
.chev{color:var(--tx3)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;color:var(--tx3);font-weight:700;padding-bottom:4px}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-size:14px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums}
.cal .d.trained{background:var(--acc);color:var(--acc-ink)}
.cal .d.is-today{box-shadow:inset 0 0 0 1.5px var(--tx2);color:var(--tx)}
.cal .d.trained.is-today{box-shadow:inset 0 0 0 2px var(--tx)}
.cal .d.future{color:var(--tx3)}

/* splits */
.split-card{display:flex;gap:10px;align-items:center;padding:14px 10px 14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px}
.split-card .grow{display:block}
.split-card .names{font-size:13px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reorder{display:flex;flex-direction:column}
.reorder .icon-btn.sm{width:34px;height:30px}
.item{display:flex;align-items:center;gap:8px;padding:12px 6px 12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.item .idx{width:26px;height:26px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--tx2);flex:none}
.item .meta{font-size:13px;color:var(--tx2)}
.item .note{font-size:12px;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* workout */
.wk-progress{margin-top:12px}
.wk-progress .lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2);margin-bottom:8px}
.wk-progress .lbl b{color:var(--tx)}
.pbar{height:8px;border-radius:8px;background:var(--s3);overflow:hidden}
.pbar>div{height:100%;background:var(--acc);border-radius:8px;transition:width .4s}
.timer-card{position:sticky;top:calc(var(--sat) + 6px);z-index:10;margin:14px 0 16px;padding:12px 12px 10px 16px;border-radius:22px;background:rgba(27,27,30,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:0 14px 30px rgba(0,0,0,.5);transition:border-color .2s}
.timer-main{display:flex;align-items:center;gap:12px}
.timer-time{font-size:46px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1;color:var(--tx3);min-width:128px}
.timer-card.running .timer-time{color:var(--tx)}
.timer-card.paused .timer-time{color:var(--tx2)}
.timer-card.over{border-color:rgba(255,159,67,.6)}
.timer-card.over .timer-time{color:var(--warn)}
.timer-main .btn.primary{flex:1;padding:0 10px}
.timer-sub{display:flex;align-items:center;gap:6px;margin-top:8px}
.timer-sub .lbl{flex:1;min-width:0;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-sub .chip{height:30px;padding:0 10px;font-size:13px}
.timer-sub .icon-btn{width:36px;height:32px;border-radius:10px}
.timer-sub .icon-btn svg{width:18px;height:18px}
.timer-bar{height:3px;background:var(--s3);border-radius:3px;overflow:hidden;margin-top:9px}
.timer-bar>div{height:100%;width:0;background:var(--acc);transition:width .25s linear}
.timer-card.over .timer-bar>div{background:var(--warn)}
.flash{animation:flash .5s ease 4}
@keyframes flash{50%{background:rgba(255,159,67,.28)}}

.ex-card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 12px 10px;margin-bottom:12px;transition:border-color .25s,background .25s;scroll-margin-top:170px}
.ex-card.complete{border-color:var(--acc-line);background:linear-gradient(180deg,rgba(201,245,88,.05),var(--s1) 40%)}
.ex-head{display:flex;gap:12px;align-items:center;padding-left:2px}
.ex-badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-weight:700;font-size:14px;color:var(--tx2);flex:none}
.ex-badge svg{width:18px;height:18px;stroke-width:3}
.ex-card.complete .ex-badge{background:var(--acc);color:var(--acc-ink)}
.ex-title{flex:1;min-width:0}
.ex-title h3{overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:13px;color:var(--tx2);margin-top:1px}
.ex-card.complete .ex-meta b{color:var(--acc)}
.ex-notes{margin:8px 2px 0;font-size:13px;color:var(--tx2)}
.ex-last{margin:10px 2px 0;font-size:13px;color:var(--tx2);background:var(--s2);border-radius:10px;padding:7px 10px}
.ex-last b{color:var(--tx);font-weight:600}
.set-head,.set-row{display:grid;grid-template-columns:28px minmax(0,1fr) 78px 64px 50px;gap:7px;align-items:center}
.set-head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:700;padding:0 2px 4px;margin-top:12px}
.set-head span:nth-child(n+3){text-align:center}
.set-row{padding:4px 2px;border-radius:12px;transition:background .2s;scroll-margin-top:190px;scroll-margin-bottom:200px}
.set-n{font-weight:700;color:var(--tx2);text-align:center;font-variant-numeric:tabular-nums}
.set-prev{color:var(--tx3);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);font-size:18px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none;padding:0 4px;font-family:inherit}
.set-row input::placeholder{color:var(--tx3);font-weight:500}
.set-row input:focus{border-color:var(--acc);background:var(--s3)}
.chk{width:50px;height:46px;border-radius:12px;background:var(--s3);display:grid;place-items:center;color:var(--tx3);border:1px solid var(--line2);transition:background .15s,color .15s}
.chk svg{width:22px;height:22px;stroke-width:3}
.chk:active{transform:scale(.92)}
.set-row.done{background:var(--acc-dim)}
.set-row.done .chk{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.set-row.done input{background:transparent;border-color:transparent}
.set-row.done input:focus{border-color:var(--acc);background:var(--s3)}
.set-row.done .set-n{color:var(--acc)}
.set-row.next{box-shadow:inset 0 0 0 1.5px var(--acc-line)}
.del{width:50px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--tx3)}
.rest-line{font-size:12px;color:var(--tx3);padding:0 0 3px 37px;font-variant-numeric:tabular-nums}
.ex-foot{display:flex;gap:6px;margin-top:6px}
.ex-foot .btn{color:var(--tx2)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.sheet-wrap.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow:auto;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(var(--sab) + 18px);transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sheet-title{font-size:19px;margin-bottom:6px}
.sheet-sub{color:var(--tx2);font-size:14px;margin-bottom:14px}
.menu{display:flex;flex-direction:column;margin-top:10px}
.menu-item{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 6px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item.danger{color:var(--danger)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--tx2);margin-bottom:6px;font-weight:600}
.input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);font-size:17px;padding:0 14px;outline:none;-webkit-appearance:none;appearance:none;font-family:inherit}
textarea.input{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
select.input{background-image:none}
.input:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick-list{max-height:42dvh;overflow:auto;margin:4px -6px 0;border-top:1px solid var(--line)}
.pick-list button{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:52px;padding:0 8px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;text-align:left}
.pick-list .used{font-size:12px;color:var(--tx3);font-weight:500}

/* settings */
.set-group{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.set-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-bottom:1px solid var(--line)}
.set-item:last-child{border-bottom:0}
.set-item .grow p{font-size:13px;color:var(--tx2);margin-top:2px}
.set-item select,.set-item input[type=text]{background:var(--s2);border:1px solid var(--line2);color:var(--tx);border-radius:10px;height:38px;padding:0 10px;font-size:16px;font-family:inherit;max-width:150px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:31px;background:var(--s3);transition:.2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span::after{transform:translateX(20px)}

/* progress */
.metric-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.metric .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
.metric .v small{font-size:13px;color:var(--tx3);font-weight:600}
.chart-card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 12px 8px;margin-top:12px}
.chart-card .h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px}
.chart-card .h b{font-size:15px}
.chart-card svg{display:block;width:100%;height:auto;overflow:visible}
.chart-empty{padding:26px 8px;text-align:center;color:var(--tx3);font-size:14px}
.delta{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--s3);color:var(--tx2)}
.delta.up{background:var(--acc-dim);color:var(--acc)}
.delta.down{background:rgba(255,92,92,.12);color:#ff8b8b}

.empty{text-align:center;padding:48px 20px;color:var(--tx2)}
.empty .ico{width:64px;height:64px;border-radius:20px;background:var(--s2);display:grid;place-items:center;margin:0 auto 16px;color:var(--acc)}
.empty .ico svg{width:30px;height:30px}
.empty h2{color:var(--tx);margin-bottom:6px}
.empty .btn{margin-top:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <div id="mini" class="mini" data-act="openWorkout" role="button" tabindex="0" hidden>
    <div class="grow"><div class="t">00:00</div><div class="lbl"></div></div>
    <button class="btn sm primary hidden" data-act="nextSet">Next set</button>
  </div>
  <nav class="tabbar" aria-label="Main">

/* ---------- IndexedDB ---------- */
const DB = {
  db: null, mem: false,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB not supported'));
      const r = indexedDB.open('gymlog', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'key' : 'id' });

      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Database blocked'));

  },
  tx(stores, fn) {
    if (this.mem) return Promise.resolve();
    return new Promise((res, rej) => {
      const t = this.db.transaction(stores, 'readwrite');
      fn(t);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('Transaction aborted'));
    });
  },
  getAll(store) {
    if (this.mem) return Promise.resolve([]);
    return new Promise((res, rej) => {
      const r = this.db.transaction(store).objectStore(store).getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  },
  put(store, val) { return this.tx([store], t => t.objectStore(store).put(val)); },
  putMany(store, vals) { return this.tx([store], t => { const os = t.objectStore(store); vals.forEach(v => os.put(v)); }); },
  del(store, key) { return this.tx([store], t => t.objectStore(store).delete(key)); },
  replaceAll(data) {
    return this.tx(STORES, t => {
      for (const s of STORES) { const os = t.objectStore(s); os.clear(); (data[s] || []).forEach(v => os.put(v)); }
    });
  },
};

async function loadAll() {
  const [ex, sp, wo, kv] = await Promise.all(STORES.map(s => DB.getAll(s)));

}

}

const saveExercise = e => persist(() => DB.put('exercises', e));
const pendingSaves = new Map();

}

}

}

/* ---------- derived data ---------- */
const doneWorkouts = () => S.workouts.filter(w => w.status === 'done').sort((a, b) => b.startedAt - a.startedAt);

    const e = w.exercises.find(x => x.exerciseId === exerciseId && x.sets.some(s => s.done));
    if (e) return { w, e, sets: e.sets.filter(s => s.done) };
  }

}
function exDoneCount(e) { return e.sets.filter(s => s.done).length; }
function exComplete(e) { const d = exDoneCount(e); return d > 0 && d >= Math.min(e.plannedSets || 1, e.sets.length); }
function workoutStats(w) {

  for (const e of w.exercises) for (const s of e.sets) if (s.done) { sets++; reps += +s.reps || 0; volume += (+s.weight || 0) * (+s.reps || 0); }

}

/* ---------- toast / sheets ---------- */

}

    let done = false;

      <form>

function pickExercise(title) {
  return new Promise(res => {
    let done = false;
    openSheet(`<h3 class="sheet-title">${esc(title)}</h3>
      <input class="input" id="pk-q" placeholder="Search or type a new exercise" autocomplete="off" autocapitalize="words" enterkeyhint="done" style="margin:6px 0 10px">
      <div class="pick-list" id="pk-list"></div>`, (wrap, close) => {

        const hits = all.filter(e => !term || e.name.toLowerCase().includes(term));

      const o = audioCtx.createOscillator(), g = audioCtx.createGain();

/* ---------- rest timer ---------- */
const TARGETS = [0, 60, 90, 120, 150, 180, 240, 300];

  return (t.accum || 0) + (t.state === 'running' ? Date.now() - t.startedAt : 0);
}

  const e = w && w.exercises.find(x => x.id === ref.exId);
  const s = e && e.sets.find(x => x.id === ref.setId);
  return { w, e, s };
}

  const { w, e, s } = findRef(S.timer.ref);
  if (s) { s.restSec = Math.round(timerElapsed() / 1000); saveWorkout(w); return { w, e }; }
  return null;
}

  S.timer = { state: 'running', startedAt: Date.now(), accum: 0, ref, notified: false };
  saveTimer(); updateTimerUI();
}

  if (r) refreshCard(r.w, r.e);
  updateTimerUI();
  return ms;
}

}

  const t = S.timer;

  else if (t.state === 'paused') { t.startedAt = Date.now(); t.state = 'running'; }

}
function timerReset() {

  saveTimer(); updateTimerUI();
}

    card.classList.toggle('running', t.state === 'running');
    card.classList.toggle('paused', t.state === 'paused');

    const fill = $('[data-timer-fill]', card);

    let lbl;
    if (t.state === 'idle') lbl = 'Rest timer starts when you tick a set';
    else if (t.state === 'paused') lbl = 'Paused';

/* ---------- workout operations ---------- */
function mkWorkoutEx(exerciseId, sets, reps, notes) {
  const ex = S.exercises.get(exerciseId);
  return {
    id: uid(), exerciseId, name: ex ? ex.name : 'Exercise', plannedSets: sets || 3, targetReps: reps || '', notes: notes || '',
    sets: Array.from({ length: Math.max(1, sets || 3) }, () => ({ id: uid(), weight: null, reps: null, done: false })),
  };
}
function startWorkout(splitId) {
  const act = activeWorkout();
  if (act) {
    if (!confirm(`You have an unfinished “${act.splitName}” workout.\n\nOK = discard it and start a new one\nCancel = go back to it`)) { go('#/workout'); return; }
    discardWorkoutData(act);
  }
  const sp = S.splits.find(s => s.id === splitId);
  const w = {
    id: uid(), status: 'active', splitId: sp ? sp.id : null, splitName: sp ? sp.name : 'Quick workout',
    startedAt: Date.now(), finishedAt: null,
    exercises: (sp ? sp.items : []).map(it => mkWorkoutEx(it.exerciseId, it.sets, it.reps, it.notes)),
  };
  S.workouts.push(w); saveWorkout(w);
  if (S.settings.todaySplitId) { S.settings.todaySplitId = null; saveSettings(); }
  requestPersist();
  go('#/workout');
}
function discardWorkoutData(w) {
  cancelTimerFor(w.id);
  S.workouts = S.workouts.filter(x => x.id !== w.id);
  persist(() => DB.del('workouts', w.id));
}
function finalizeWorkout(w) {
  cancelTimerFor(w.id);
  w.exercises.forEach(e => (e.sets = e.sets.filter(s => s.done)));
  w.exercises = w.exercises.filter(e => e.sets.length);
  w.status = 'done'; w.finishedAt = Date.now();
  saveWorkout(w);
  manageWakeLock();
  toast('Workout saved 💪');
  go('#/history/' + w.id);
}
function placeholders(e, j, last) {
  let w = '', r = '';
  for (let k = j - 1; k >= 0; k--) { const s = e.sets[k]; if (w === '' && s.weight != null) w = s.weight; if (r === '' && s.reps != null) r = s.reps; }
  const ls = last ? last.sets : [];
  const lp = ls[j] || ls[ls.length - 1];
  if (w === '' && lp) w = lp.weight;
  if (ls[j]) r = ls[j].reps; // reps: same set last session is the best guide
  if (r === '' && lp) r = lp.reps;
  if (r === '') { const t = parseInt(e.targetReps, 10); if (t) r = t; }
  return { w: w === '' || w == null ? '' : fmtKg(w), r: r ?? '' };
}

/* ---------- view: progress ---------- */
function exerciseSessions(exId) {
  return doneWorkouts().slice().reverse().map(w => {
    const sets = w.exercises.filter(e => e.exerciseId === exId).flatMap(e => e.sets.filter(s => s.done));
    if (!sets.length) return null;
    let top = sets[0];
    for (const s of sets) if ((+s.weight || 0) > (+top.weight || 0) || ((+s.weight || 0) === (+top.weight || 0) && (+s.reps || 0) > (+top.reps || 0))) top = s;
    return {
      w, t: w.startedAt, sets, top: +top.weight || 0, topReps: +top.reps || 0,
      reps: sets.reduce((a, s) => a + (+s.reps || 0), 0),
      volume: sets.reduce((a, s) => a + (+s.weight || 0) * (+s.reps || 0), 0),
      e1rm: Math.max(...sets.map(s => (+s.weight || 0) * (1 + (+s.reps || 0) / 30))),

  }).filter(Boolean);
}
let chartN = 0;

  const lastP = pts[pts.length - 1], maxI = vs.indexOf(Math.max(...vs));
  const dots = pts.length <= 40 ? pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" fill="${i === pts.length - 1 ? 'var(--acc)' : 'var(--s1)'}" stroke="var(--acc)" stroke-width="2"/>`).join('') : '';
  const fmt = v => fmtBig(v) === String(Math.round(v)) && v < 1000 ? fmtKg(v) : fmtBig(v);

    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}
    <text x="${Math.min(W - 4, Math.max(4, x(maxI)))}" y="${y(vs[maxI]) - 9}" text-anchor="${maxI === 0 ? 'start' : maxI === pts.length - 1 ? 'end' : 'middle'}" fill="var(--tx2)" font-size="11" font-weight="600">${fmt(vs[maxI])}${unit}</text>
    <text x="2" y="${H - 4}" fill="var(--tx3)" font-size="10.5">${fmtDate(pts[0].t, { day: 'numeric', month: 'short' })}</text>
    <text x="${W - 2}" y="${H - 4}" text-anchor="end" fill="var(--tx3)" font-size="10.5">${fmtDate(lastP.t, { day: 'numeric', month: 'short' })}</text>

}
function barChart(items) {

    return `<rect x="${x}" y="${H - pb - Math.max(h, 3)}" width="${bw}" height="${Math.max(h, 3)}" rx="5" fill="${it.v ? (i === n - 1 ? 'var(--acc)' : 'rgba(201,245,88,.55)') : 'var(--s3)'}"/>
      ${it.v ? `<text x="${x + bw / 2}" y="${yy - 4}" text-anchor="middle" fill="var(--tx2)" font-size="10.5" font-weight="600">${it.v}</text>` : ''}

}
function viewProgress() {

  }

  html += `<div class="metric-row"><div class="metric"><div class="eyebrow">Total workouts</div><div class="v">${dw.length}</div></div>

/* ---------- router ---------- */
const ROUTES = [

  [/^#\/history$/, viewHistory], [/^#\/history\/(.+)$/, viewWorkoutDetail], [/^#\/progress$/, viewProgress],
  [/^#\/progress\/(.+)$/, viewExerciseProgress], [/^#\/settings$/, viewSettings],

const TAB_FOR = { home: 'home', workout: 'home', settings: 'home', splits: 'splits', split: 'splits', history: 'history', progress: 'progress' };
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function render() {
  const h = location.hash || '#/home';

    ]);
  },
  addExToWorkout: async () => {
    const w = activeWorkout(); if (!w) return;
    const id = await pickExercise('Add exercise to workout'); if (!id) return;
    const ls = lastSessionFor(id, w.id);
    const e = mkWorkoutEx(id, ls ? Math.max(1, ls.sets.length) : 3, ls ? ls.e.targetReps : '8-12', '');
    w.exercises.push(e); saveWorkout(w); render();
    setTimeout(() => document.getElementById('ex-' + e.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
  },
  finishWorkout: () => {
    const w = activeWorkout(); if (!w) return;
    flushSaves();
    const done = w.exercises.reduce((a, e) => a + exDoneCount(e), 0);
    const pending = w.exercises.flatMap(e => e.sets.filter(s => !s.done && s.reps != null && s.reps > 0));
    if (!done && !pending.length) {
      if (confirm('No sets have been completed. Discard this workout?')) { discardWorkoutData(w); go('#/home'); }
      return;
    }
    const remaining = w.exercises.filter(e => !exComplete(e)).length;
    if (pending.length) {
      menuSheet('Finish workout?', [
        { label: `Mark ${pending.length} entered set${pending.length > 1 ? 's' : ''} complete & finish`, icon: 'check', onClick: () => {
          pending.forEach(s => { s.done = true; s.weight = s.weight ?? 0; s.reps = Math.round(s.reps); s.completedAt = Date.now(); });
          finalizeWorkout(w);
        } },
        { label: 'Finish without them', icon: 'flag', onClick: () => finalizeWorkout(w) },
      ], `${pending.length} set${pending.length > 1 ? 's have' : ' has'} values entered but ${pending.length > 1 ? 'aren’t' : 'isn’t'} ticked.`);
      return;
    }
    menuSheet('Finish workout?', [{ label: 'Finish & save', icon: 'flag', onClick: () => finalizeWorkout(w) }],
      `${done} sets completed${remaining ? ` · ${remaining} exercise${remaining > 1 ? 's' : ''} not finished` : ''}. Unticked sets won’t be saved.`);
  },
  discardWorkout: () => {
    const w = activeWorkout(); if (!w) return;
    if (!confirm('Discard this workout? All sets recorded in it will be deleted.')) return;
    discardWorkoutData(w); render(); toast('Workout discarded'); go('#/home');
  },

  /* splits */
  newSplit: async () => {
    const name = await promptSheet({ title: 'New split', label: 'Name', placeholder: 'e.g. Push, Upper Body, Legs', submit: 'Create' });
    if (!name) return;
    const sp = { id: uid(), name, items: [], order: S.splits.length, createdAt: Date.now() };
    S.splits.push(sp); saveSplit(sp); go('#/split/' + sp.id);
  },
  starter: () => {
    const T = {
      Push: [['Bench Press', 4, '6-8'], ['Overhead Press', 3, '8-10'], ['Incline Dumbbell Press', 3, '8-12'], ['Lateral Raise', 3, '12-15'], ['Triceps Pushdown', 3, '10-12']],
      Pull: [['Pull-Up', 3, '6-10'], ['Barbell Row', 4, '6-8'], ['Lat Pulldown', 3, '10-12'], ['Face Pull', 3, '12-15'], ['Biceps Curl', 3, '10-12']],
      Legs: [['Squat', 4, '5-8'], ['Romanian Deadlift', 3, '8-10'], ['Leg Press', 3, '10-12'], ['Leg Curl', 3, '10-12'], ['Calf Raise', 4, '12-15']],
    };
    for (const [name, list] of Object.entries(T)) {
      const sp = { id: uid(), name, order: S.splits.length, createdAt: Date.now(), items: list.map(([n, s, r]) => ({ id: uid(), exerciseId: getOrCreateExercise(n).id, sets: s, reps: r, notes: '' })) };
      S.splits.push(sp);
    }
    saveAllSplits(); render(); toast('Template added — edit anything you like');
  },
  splitMove: el => {
    const i = S.splits.findIndex(s => s.id === el.dataset.id), j = i + (+el.dataset.d);
    if (i < 0 || j < 0 || j >= S.splits.length) return;
    [S.splits[i], S.splits[j]] = [S.splits[j], S.splits[i]];
    saveAllSplits(); render();
  },
  splitMenu: el => {
    const sp = S.splits.find(s => s.id === el.dataset.id); if (!sp) return;
    menuSheet(sp.name, [
      { label: 'Rename', icon: 'edit', onClick: async () => { const n = await promptSheet({ title: 'Rename split', label: 'Name', value: sp.name }); if (n) { sp.name = n; saveSplit(sp); render(); } } },
      { label: 'Duplicate', icon: 'plus', onClick: () => {
        const c = { ...sp, id: uid(), name: sp.name + ' (copy)', createdAt: Date.now(), items: sp.items.map(it => ({ ...it, id: uid() })) };
        S.splits.splice(S.splits.indexOf(sp) + 1, 0, c); saveAllSplits(); go('#/split/' + c.id);
      } },
      { label: 'Delete split', icon: 'trash', danger: true, onClick: () => {
        if (!confirm(`Delete “${sp.name}”? Your workout history is kept.`)) return;
        S.splits = S.splits.filter(s => s.id !== sp.id); persist(() => DB.del('splits', sp.id)); saveAllSplits();
        if (S.settings.todaySplitId === sp.id) { S.settings.todaySplitId = null; saveSettings(); }
        go('#/splits');
      } },
    ]);
  },
  addItem: async el => {
    const sp = S.splits.find(s => s.id === el.dataset.split); if (!sp) return;
    const id = await pickExercise(`Add to ${sp.name}`); if (!id) return;
    const ex = S.exercises.get(id);
    const other = S.splits.flatMap(s => s.items).find(i => i.exerciseId === id);
    const r = await exerciseSheet({ title: `Add ${ex.name}`, name: ex.name, sets: other?.sets || 3, reps: other?.reps || '8-12', notes: other?.notes || '', exerciseId: id, submit: 'Add to split' });
    if (!r) return;
    if (r.name !== ex.name) { ex.name = r.name; saveExercise(ex); }
    sp.items.push({ id: uid(), exerciseId: id, sets: r.sets, reps: r.reps, notes: r.notes });
    saveSplit(sp); render();
  },
  editItem: async el => {
    const sp = S.splits.find(s => s.id === el.dataset.split), it = sp?.items.find(i => i.id === el.dataset.item); if (!it) return;
    const ex = S.exercises.get(it.exerciseId);
    const r = await exerciseSheet({ title: 'Edit exercise', name: ex?.name || '', sets: it.sets, reps: it.reps, notes: it.notes, exerciseId: it.exerciseId });
    if (!r) return;
    if (ex && r.name !== ex.name) {
      const dupe = [...S.exercises.values()].find(x => x.id !== ex.id && x.name.toLowerCase() === r.name.toLowerCase());
      if (dupe && confirm(`“${dupe.name}” already exists. Link this slot to the existing exercise (shares its history)?`)) it.exerciseId = dupe.id;
      else { ex.name = r.name; saveExercise(ex); }
    }
    Object.assign(it, { sets: r.sets, reps: r.reps, notes: r.notes });
    saveSplit(sp); render();
  },
  itemMove: el => {
    const sp = S.splits.find(s => s.id === el.dataset.split); if (!sp) return;
    const i = sp.items.findIndex(x => x.id === el.dataset.item), j = i + (+el.dataset.d);
    if (i < 0 || j < 0 || j >= sp.items.length) return;
    [sp.items[i], sp.items[j]] = [sp.items[j], sp.items[i]];
    saveSplit(sp); render();
  },
  removeItem: el => {
    const sp = S.splits.find(s => s.id === el.dataset.split); if (!sp) return;
    const it = sp.items.find(x => x.id === el.dataset.item);
    if (!confirm(`Remove ${S.exercises.get(it.exerciseId)?.name || 'this exercise'} from ${sp.name}? History is kept.`)) return;
    sp.items = sp.items.filter(x => x !== it); saveSplit(sp); render();
  },

  /* history */
  hAddSet: el => {
    const { w, e } = ctx(el); if (!e) return;
    const l = e.sets[e.sets.length - 1];
    e.sets.push({ id: uid(), weight: l ? l.weight : 0, reps: l ? l.reps : 0, done: true, completedAt: Date.now() });
    saveWorkout(w); render();
  },
  hRemoveSet: el => {
    const { w, e, s } = ctx(el); if (!s) return;
    if (!confirm('Delete this set?')) return;
    e.sets = e.sets.filter(x => x !== s);
    if (!e.sets.length) w.exercises = w.exercises.filter(x => x !== e);
    saveWorkout(w); render();
  },
  historyMenu: el => {
    const { w } = ctx(el); if (!w) return;
    menuSheet(w.splitName, [
      { label: 'Rename workout', icon: 'edit', onClick: async () => { const n = await promptSheet({ title: 'Rename workout', label: 'Name', value: w.splitName }); if (n) { w.splitName = n; saveWorkout(w); render(); } } },
      { label: 'Edit duration', icon: 'history', onClick: async () => {
        const n = await promptSheet({ title: 'Duration (minutes)', label: 'Minutes', value: String(Math.round((w.finishedAt - w.startedAt) / 60000)) });
        const m = parseNum(n); if (m != null && m > 0) { w.finishedAt = w.startedAt + m * 60000; saveWorkout(w); render(); }
      } },
      { label: 'Delete workout', icon: 'trash', danger: true, onClick: () => ACT.deleteWorkout(el) },
    ]);
  },
  deleteWorkout: el => {
    const { w } = ctx(el); if (!w) return;
    if (!confirm('Delete this workout permanently?')) return;
    S.workouts = S.workouts.filter(x => x !== w); persist(() => DB.del('workouts', w.id));
    toast('Workout deleted'); go('#/history');
  },

  /* settings */
  exportData: () => exportData(),
  importData: () => $('#import-file').click(),
  clearAll: async () => {
    if (!confirm('Erase ALL splits, exercises and workout history from this device?')) return;
    if (!confirm('Are you absolutely sure? This cannot be undone unless you have a backup.')) return;
    await DB.replaceAll({});
    await loadAll(); go('#/home'); toast('All data erased');
  },
};

async function exportData() {
  flushSaves();
  const data = { app: 'gymlog', version: 1, exportedAt: new Date().toISOString(), exercises: [...S.exercises.values()], splits: S.splits, workouts: S.workouts, settings: S.settings };
  const json = JSON.stringify(data);
  const name = `gymlog-backup-${dateKey(Date.now())}.json`;
  const mark = () => { S.meta.lastBackup = Date.now(); saveMeta(); if (location.hash === '#/settings') render(); };
  let file;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'GymLog backup' }); mark(); toast('Backup exported'); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const blob = file || new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  mark(); toast('Backup downloaded');
}
async function importBackup(file) {
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON', 'err'); return; }
  if (!d || d.app !== 'gymlog' || !Array.isArray(d.workouts) || !Array.isArray(d.splits) || !Array.isArray(d.exercises)) { toast('Not a GymLog backup file', 'err'); return; }
  const when = d.exportedAt ? new Date(d.exportedAt).toLocaleString('en-AU') : 'unknown date';
  if (!confirm(`Restore backup from ${when}?\n\n${d.splits.length} splits · ${d.exercises.length} exercises · ${d.workouts.length} workouts\n\nThis REPLACES everything currently in the app.`)) return;
  const lastBackup = S.meta.lastBackup;
  await DB.replaceAll({
    exercises: d.exercises, splits: d.splits, workouts: d.workouts,
    kv: [{ key: 'settings', value: { ...DEFAULT_SETTINGS, ...(d.settings || {}) } }, { key: 'timer', value: { state: 'idle' } }, { key: 'meta', value: { lastBackup } }],
  });
  if (DB.mem) { S.exercises = new Map(d.exercises.map(e => [e.id, e])); S.splits = d.splits; S.workouts = d.workouts; }
  else await loadAll();
  go('#/home'); toast('Backup restored ✓');
}

/* ---------- event wiring ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.closest('.sheet')) return;
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.field) {
    const { w, s } = ctx(el); if (!s) return;
    const v = parseNum(el.value);
    s[el.dataset.field] = el.dataset.field === 'reps' && v != null ? Math.round(v) : v;
    saveWorkoutSoon(w);
    return;
  }
  if (el.dataset.settingText) { S.settings[el.dataset.settingText] = el.value.trim(); saveSettings(); }
});
document.addEventListener('focusout', ev => {
  const el = ev.target;
  if (!el.dataset || !el.dataset.field) return;
  const { w, e } = ctx(el); if (!w) return;
  flushSaves();
  if (w.status === 'done') {
    // refresh header stats lazily without stealing focus
    setTimeout(() => { if (!document.activeElement || !document.activeElement.dataset?.field) render(); }, 120);
  }
});
document.addEventListener('keydown', ev => {
  const el = ev.target;
  if (ev.key === 'Enter' && el.dataset && el.dataset.field) {
    ev.preventDefault();
    const row = el.closest('.set-row');
    if (el.dataset.field === 'weight') $('[data-field="reps"]', row).focus();
    else if (row.querySelector('[data-act="toggleSet"]')) ACT.toggleSet(row.querySelector('[data-act="toggleSet"]'));
    else el.blur();
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.id === 'import-file') { const f = el.files[0]; el.value = ''; if (f) importBackup(f); return; }
  if (el.dataset.settingNum) { S.settings[el.dataset.settingNum] = +el.value; saveSettings(); return; }
  if (el.dataset.setting) {
    const k = el.dataset.setting;
    if (k === 'notify' && el.checked) {
      try {
        const p = await Notification.requestPermission();
        if (p !== 'granted') { el.checked = false; S.settings.notify = false; saveSettings(); toast('Notifications not allowed'); render(); return; }
      } catch (e) { el.checked = false; return; }
    }
    S.settings[k] = el.checked; saveSettings(); manageWakeLock();
    if (k === 'notify') render();
    return;
  }
  if (el.dataset.change === 'wkDate') {
    const { w } = ctx(el); if (!w || !el.value) return;
    const ts = new Date(el.value).getTime(); if (!Number.isFinite(ts)) return;
    const delta = ts - w.startedAt;
    w.startedAt = ts; if (w.finishedAt) w.finishedAt += delta;
    w.exercises.forEach(e => e.sets.forEach(s => { if (s.completedAt) s.completedAt += delta; }));
    saveWorkout(w); toast('Date updated'); render();
  }
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSaves();
  else { updateTimerUI(); manageWakeLock(); }
});
window.addEventListener('pagehide', flushSaves);

/* ---------- boot ---------- */
async function boot() {
  try { DB.db = await DB.open(); }
  catch (e) { console.warn('IndexedDB unavailable', e); DB.mem = true; }
  try { await loadAll(); } catch (e) { console.error(e); DB.mem = true; }
  if (!location.hash) history.replaceState(null, '', activeWorkout() ? '#/workout' : '#/home');
  render();
  setInterval(updateTimerUI, 250);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) toast('App updated — close & reopen to get the latest version');
        });
      });
    }).catch(() => {});
  }
  if (S.workouts.length) requestPersist();
}
boot();
</script>
